    let productMap = {}, cart = {}, cartUnits = {}, cartModal = null, unitModal = null, pendingProductCode = null;
    function init() {
        productMap = {}; 
        fullCatalog.forEach(c=>{c.items.forEach(i=>{const m=i.match(/^(.*)\s*\(([A-Za-z0-9]+)\)$/);if(m)productMap[m[2]]={fullName:i,name:m[1],code:m[2]}})});
        
        const savedFreq = localStorage.getItem(storageKey + '_learned');
        if(savedFreq) {
            try { 
                learnedFrequent = JSON.parse(savedFreq); 
            } catch(e) {}
        }

        loadCart(); renderFrequent(); renderAll();
        cartModal=new bootstrap.Modal(document.getElementById('cartModal')); unitModal=new bootstrap.Modal(document.getElementById('unitSelectionModal'));
    }
    
    function getDeliveryDate() {
        const now = new Date();
        const hour = now.getHours();
        let targetDate = new Date(now);
        
        if (hour >= 11) {
            targetDate.setDate(targetDate.getDate() + 1);
        }
        
        const y = targetDate.getFullYear();
        const m = String(targetDate.getMonth() + 1).padStart(2, '0');
        const d = String(targetDate.getDate()).padStart(2, '0');
        const weekdays = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
        const w = weekdays[targetDate.getDay()];
        
        return `${y}-${m}-${d} (${w})`;
    }

    function loadCart() {
        const c=localStorage.getItem('orderCart_'+customerCode), u=localStorage.getItem('orderUnits_'+customerCode);
        if(c)try{cart=JSON.parse(c)}catch(e){} if(u)try{cartUnits=JSON.parse(u)}catch(e){}
        calcTotal();
    }
    function saveCart() {
        localStorage.setItem('orderCart_'+customerCode, JSON.stringify(cart));
        localStorage.setItem('orderUnits_'+customerCode, JSON.stringify(cartUnits));
    }
    function switchTab(t){document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.nav-link').forEach(e=>e.classList.remove('active'));document.getElementById('tab-'+t).classList.add('active');event.target.classList.add('active');if(t==='all'){clearSearch();document.getElementById('searchBar').style.display='block';window.scrollTo(0,0)}else{document.getElementById('searchBar').style.display='none'}}
    
    function renderFrequent(){
        const c=document.getElementById('tab-frequent');
        let h='';
        
        frequentCodes.forEach(code=>{
            const p=productMap[code];
            if(p) { // Filter unknown
                h+=createProductRow(p.fullName);
            }
        });
        
        if (learnedFrequent.length > 0) {
            let uniqueLearned = learnedFrequent.filter(code => !frequentCodes.includes(code)); 
            if (uniqueLearned.length > 0) {
                h += `<div class="freq-divider">👇 最近新增產品 👇</div>`;
                uniqueLearned.forEach(code=>{
                    const p=productMap[code];
                    if(p) { 
                        h+=createProductRow(p.fullName);
                    }
                });
            }
        }
        c.innerHTML=h;
    }
    
    function renderAll(f=''){const c=document.getElementById('tab-all');let h='';const t=f.toUpperCase().split('');fullCatalog.forEach(cat=>{const items=cat.items.filter(i=>{if(!f)return true;const u=i.toUpperCase();return t.every(x=>u.includes(x))});if(items.length>0){if(!f)h+=`<div class="cat-header">${cat.cat}</div>`;items.forEach(i=>h+=createProductRow(i))}});if(h==='')h='<div class="text-center p-5 text-muted">找不到相關產品</div>';c.innerHTML=h}
    
    function createProductRow(s){
        let n=s,c='UNKNOWN';const m=s.match(/^(.*)\s*\(([A-Za-z0-9]+)\)$/);if(m){n=m[1];c=m[2]}else{c=s.replace(/[^a-zA-Z0-9]/g,'')}
        
        if (outOfStockCodes.includes(c)) {
            return `<div class="product-row oos" id="row-${c}"><div class="p-info"><div class="p-name">${n} <span class="oos-badge">🚫 缺貨</span></div><div class="p-code">${c}</div></div><div class="qty-control disabled"><div class="qty-btn disabled">-</div><input type="text" class="qty-input" value="0" readonly disabled><div class="qty-btn disabled">+</div></div></div>`;
        }

        const q=cart[c]||0; let val=q, cls='qty-input'; if(q>0&&cartUnits[c]==='kg'){val+=' K';cls+=' unit-kg'}
        const sel=q>0?'selected':'';
        return `<div class="product-row ${sel}" id="row-${c}"><div class="p-info"><div class="p-name">${n}</div><div class="p-code">${c}</div></div><div class="qty-control"><div class="qty-btn" onclick="updateQty('${c}',-1)">-</div><input type="text" class="${cls}" id="qty-${c}" value="${val}" readonly><div class="qty-btn" onclick="updateQty('${c}',1)">+</div></div></div>`
    }
    
    function filterAllProducts(){const v=document.getElementById('searchInput').value;document.getElementById('clearSearchBtn').style.display=v.length?'block':'none';renderAll(v)}
    function clearSearch(){document.getElementById('searchInput').value='';document.getElementById('clearSearchBtn').style.display='none';renderAll('')}
    
    function updateQty(c,d){
        if (outOfStockCodes.includes(c)) return;

        if(eelProducts.includes(c)){
            if(d>0&&(!cart[c]||cart[c]===0)){cart[c]=5;cartUnits[c]='kg'}else{if(!cart[c])cart[c]=0;cart[c]+=d*5}
            if(cart[c]<=0){delete cart[c];delete cartUnits[c]}
            syncUI(c); return;
        }
        if(d>0&&(!cart[c]||cart[c]===0)&&weightedProducts.includes(c)&&!cartUnits[c]){
            pendingProductCode=c;
            const leftBtn = document.getElementById('btn-unit-left');
            const rightBtn = document.getElementById('btn-unit-right');

            leftBtn.className = 'btn-unit-select';
            rightBtn.className = 'btn-unit-select';

            if (c === 'B01') {
                leftBtn.classList.add('kg');
                leftBtn.innerHTML = '<i class="bi bi-speedometer2"></i> KG<br>(默認)';
                leftBtn.onclick = function() { confirmUnit('kg'); };

                rightBtn.classList.add('piece');
                rightBtn.innerHTML = '<i class="bi bi-box-seam"></i> 隻';
                rightBtn.onclick = function() { confirmUnit('piece'); };
            } else {
                leftBtn.classList.add('piece');
                leftBtn.innerHTML = '<i class="bi bi-box-seam"></i> 件 / 包<br>(默認)';
                leftBtn.onclick = function() { confirmUnit('piece'); };

                rightBtn.classList.add('kg');
                rightBtn.innerHTML = '<i class="bi bi-speedometer2"></i> KG<br>(公斤)';
                rightBtn.onclick = function() { confirmUnit('kg'); };
            }
            unitModal.show(); return;
        }
        if(!cart[c])cart[c]=0; cart[c]+=d;
        if(cart[c]<=0){delete cart[c];delete cartUnits[c]}
        syncUI(c);
    }
    
    function confirmUnit(u){if(pendingProductCode){cartUnits[pendingProductCode]=u;updateQty(pendingProductCode,1);unitModal.hide();pendingProductCode=null}}
    
    function syncUI(c){
        const q=cart[c]||0, u=cartUnits[c];
        document.querySelectorAll(`#qty-${c}`).forEach(i=>{
            i.className='qty-input'+(u==='kg'?' unit-kg':'');
            i.value=q+(u==='kg'?' K':'');
            const r=i.closest('.product-row');
            if(r&&!r.classList.contains('modal-row')){q>0?r.classList.add('selected'):r.classList.remove('selected')}
        });
        calcTotal(); saveCart(); if(document.getElementById('cartModal').classList.contains('show'))renderCartModalItems();
    }
    
    function clearCart(){if(Object.keys(cart).length===0)return;if(confirm("確定要清空所有已選貨品嗎？")){cart={};cartUnits={};localStorage.removeItem('orderCart_'+customerCode);localStorage.removeItem('orderUnits_'+customerCode);renderFrequent();renderAll();calcTotal();renderCartModalItems()}}
    
    function calcTotal(){
        const count=Object.keys(cart).length; document.getElementById('totalQty').innerText=count;
        const b=document.getElementById('viewCartBtn');
        if(count>0){b.classList.add('active');b.disabled=false;b.innerHTML=`<i class="bi bi-cart-check-fill"></i> 查看已選 (${count})`}else{b.classList.remove('active');b.disabled=true;b.innerHTML=`<i class="bi bi-cart3"></i> 查看已選`}
    }
    function openCartModal(){renderCartModalItems();cartModal.show()}
    function renderCartModalItems(){
        const c=document.getElementById('cartModalBody');
        if(Object.keys(cart).length===0){c.innerHTML='<div class="text-center p-4 text-muted">尚未選擇任何產品</div>';return}
        let h=''; for(let k in cart){const p=productMap[k];h+=createProductRow(p?p.fullName:`${k} (未知)`);} c.innerHTML=h;
    }
    
    // V9.0 Sorted Send Logic
    function sendWhatsApp(mode){
        if(Object.keys(cart).length===0){alert("請先選擇產品！");return}
        
        const dateStr = getDeliveryDate();
        let msg=`${customerCode} ${customerName}\n日期：${dateStr}\n訂貨單：\n\n`;
        const fmt=c=>{const p=productMap[c];const n=p?p.name:c;let q=cart[c].toString();if(cartUnits[c]==='kg')q+='K';return ` ${q.padEnd(5,' ')} ${n} (${c})\n`};
        
        let codes = Object.keys(cart).sort(); 
        
        let hasNewItems = false;
        for(let c of codes){
            if(!frequentCodes.includes(c) && !learnedFrequent.includes(c)){
                learnedFrequent.push(c);
                hasNewItems = true;
            }
            msg+=fmt(c); 
        }
        
        if(hasNewItems){
            localStorage.setItem(storageKey + '_learned', JSON.stringify(learnedFrequent));
            renderFrequent(); 
        }

        if (mode === 'direct') {
            window.open(`https://api.whatsapp.com/send?phone=${salesPhone}&text=${encodeURIComponent(msg)}`,'_blank');
        } else {
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`,'_blank');
        }
        
        setTimeout(() => {
            cart = {}; cartUnits = {};
            saveCart();
            renderAll(); renderFrequent(); calcTotal();
            if(document.getElementById('cartModal').classList.contains('show')) cartModal.hide();
        }, 1000);
    }
    init();
</script>
</body>
</html>
